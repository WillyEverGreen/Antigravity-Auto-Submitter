<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Shield Base Outline -->
  <path d="M 64,20 
           C 86,20 102,26 102,38 
           C 102,68 84,94 64,108 
           C 44,94 26,68 26,38 
           C 26,26 42,20 64,20 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Dynamic Ring (Antigravity Singularity / Orbit) -->
  <circle cx="64" cy="56" r="18" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Central Accelerator Node -->
  <polygon points="64,44 74,62 54,62" fill="url(#innerGrad)" />
  <polygon points="64,68 74,50 54,50" fill="url(#innerGrad)" opacity="0.6" />

  <!-- Verification Check Accent -->
  <path d="M 52,86 L 61,95 L 77,77" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Ambient Micro Sensors -->
  <circle cx="64" cy="32" r="2.5" fill="#38bdf8" />
  <circle cx="38" cy="54" r="2" fill="#818cf8" />
  <circle cx="90" cy="54" r="2" fill="#c084fc" />
</svg>
